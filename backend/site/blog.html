<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Fresh Hot Bread All Day</title>
  <meta name="description" content="Read the latest stories, recipes, and bakery updates from Fresh Hot Bread All Day. Learn about Señorita Bread, baking tips, and community events in Stockton, CA.">
  <link rel="canonical" href="https://www.freshhotbreadallday.com/blog" />
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <style>
    .blog-hero {
      background: linear-gradient(135deg, #960909 0%, #6B0707 100%);
      color: #fff;
      text-align: center;
      padding: 100px 20px 60px;
      margin-top: 70px;
    }
    .blog-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin: 0;
      font-weight: 800;
    }
    .blog-hero p {
      font-size: 18px;
      margin-top: 10px;
      opacity: 0.9;
    }

    .blog-list-section {
      padding: 80px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }
    .blog-card {
      background: #FFFFFF;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .blog-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }
    .blog-card-image {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #f5f5f5;
    }
    .blog-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .blog-card:hover .blog-card-image img {
      transform: scale(1.08);
    }
    .blog-card-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .blog-card-date {
      color: #960909;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .blog-card h3 {
      font-family: 'Playfair Display', serif;
      color: #2C2C2C;
      font-size: 22px;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    .blog-card p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      flex: 1;
      margin-bottom: 20px;
    }
    .blog-card-link {
      display: inline-block;
      color: #960909;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 2px solid #960909;
      padding-bottom: 2px;
      align-self: flex-start;
    }
    .blog-card-link:hover {
      color: #6B0707;
    }
    .blog-empty {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 18px;
    }
    @media (max-width: 600px) {
      .blog-hero h1 { font-size: 36px; }
      .blog-list-section { padding: 50px 15px; }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <a href="/" class="logo">
      <img src="images/logo.jpg" alt="Fresh Hot Bread Logo">
      <div class="logo-text">
        <span>Fresh Hot</span>
        <strong>Bread</strong>
      </div>
    </a>

    <ul class="nav-links" id="nav-links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#menu">Menu</a></li>
      <li><a href="/blog" class="active">Blog</a></li>
      <li><a href="/#gallery">Gallery</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>

    <div class="nav-right">
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="blog-hero">
    <h1>Our Bakery Blog</h1>
    <p>Stories, recipes & fresh updates from Stockton's favorite bakery</p>
  </section>

  <!-- Blog List -->
  <section class="blog-list-section">
    <div id="blog-list" class="blog-grid">
      <p class="blog-empty">Loading latest posts...</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <img src="images/logo.jpg" alt="Fresh Hot Bread Logo" class="footer-logo">
          <div class="footer-brand-text">
            <h3>Fresh Hot Bread All Day</h3>
            <p>Warm • Sweet • Made Fresh Daily</p>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2025 Fresh Hot Bread All Day — All Rights Reserved</p>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('blog-list');
      try {
        const response = await fetch('/api/blogs');
        const blogs = await response.json();

        if (!blogs || blogs.length === 0) {
          container.innerHTML = '<p class="blog-empty">No blogs posted yet. Check back soon!</p>';
          return;
        }

        container.innerHTML = blogs.map(blog => {
          const date = new Date(blog.created_at).toLocaleDateString('en-US', { 
            month: 'long', day: 'numeric', year: 'numeric' 
          });
          const imageUrl = blog.image_url || 'images/logo.jpg';
          const excerpt = blog.excerpt || (blog.content ? blog.content.substring(0, 120) + '...' : '');

          return `
            <article class="blog-card">
              <a href="/post.html?slug=${encodeURIComponent(blog.slug)}" class="blog-card-image">
                <img src="${imageUrl}" alt="${blog.title}" loading="lazy">
              </a>
              <div class="blog-card-body">
                <div class="blog-card-date">${date}</div>
                <h3>${blog.title}</h3>
                <p>${excerpt}</p>
                <a href="/post.html?slug=${encodeURIComponent(blog.slug)}" class="blog-card-link">Read More →</a>
              </div>
            </article>
          `;
        }).join('');
      } catch (error) {
        container.innerHTML = '<p class="blog-empty">Failed to load blogs. Please try again later.</p>';
      }
    });

    // Navbar hamburger
    document.getElementById('hamburger')?.addEventListener('click', function() {
      this.classList.toggle('active');
      document.getElementById('nav-links').classList.toggle('active');
    });
  </script>

</body>
</html>
