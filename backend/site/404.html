<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Fresh Hot Bread All Day</title>
  <style>
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background-color: #FFFEF9;
      color: #2C2C2C;
      margin: 0;
    }
    .error-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      font-size: 96px;
      color: #960909;
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1;
    }
    h2 {
      font-size: 26px;
      margin: 20px 0 10px;
      color: #2C2C2C;
    }
    p {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background-color: #960909;
      color: #ffffff;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      transition: background 0.2s;
    }
    a:hover {
      background-color: #6B0707;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
    <a href="/">Back to Homepage</a>
  </div>
</body>
</html>
